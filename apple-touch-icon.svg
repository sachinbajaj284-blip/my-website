<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FCEFA1"/><stop offset="20%" stop-color="#F4D976"/>
      <stop offset="48%" stop-color="#EBC24E"/><stop offset="72%" stop-color="#DBAA30"/>
      <stop offset="100%" stop-color="#B67C10"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173257"/><stop offset="55%" stop-color="#0E2244"/>
      <stop offset="100%" stop-color="#081428"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.75">
      <stop offset="0%" stop-color="#2A4670" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2A4670" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed navy tile (iOS applies its own corner mask) -->
  <rect x="0" y="0" width="180" height="180" fill="url(#navy)"/>
  <rect x="0" y="0" width="180" height="180" fill="url(#glow)"/>
