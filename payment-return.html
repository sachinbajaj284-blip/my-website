<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Payment Received | Lume Live</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0D1B40,#0A6E6E);font-family:Arial,sans-serif;color:#102033;padding:18px}
.card{width:min(520px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.28);text-align:center}
img{width:74px;height:74px;object-fit:contain;margin-bottom:10px}
h1{font-family:Georgia,serif;color:#0D1B40;margin:0 0 10px;font-size:2rem}
p{color:#55706D;line-height:1.6;margin:0 0 18px}
.status{margin:0 0 18px;padding:12px 14px;border-radius:14px;background:#EEF7F5;color:#0A6E6E;font-weight:800;font-size:.92rem}
.status.wait{background:#FFF7E8;color:#9A6414}
.status.fail{background:#FFF1F1;color:#A63737}
.actions{display:grid;gap:10px}
a{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:999px;text-decoration:none;font-weight:900}
.primary{background:linear-gradient(135deg,#C9933A,#E8B95A);color:#0D1B40}
.ghost{background:#EEF7F5;color:#0A6E6E;border:1px solid #D6EAE7}
</style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="Lume Live">
    <h1>Payment Step Complete</h1>
    <p>Thank you. We are checking the payment status now. Once Cashfree confirms it, you can continue without sending a screenshot.</p>
    <div class="status wait" id="statusBox">Checking Cashfree payment status...</div>
    <div class="actions">
      <a class="primary" id="continueLink" href="assessment.html#self-assessments">Continue Assessment</a>
      <a class="ghost" href="https://wa.me/917015671280?text=Hi%20Lume%20Live!%20I%20have%20completed%20my%20Cashfree%20payment.%20Please%20confirm%20my%20access." target="_blank" rel="noopener">Confirm On WhatsApp</a>
      <a class="ghost" href="index.html">Back To Home</a>
    </div>
  </main>
<script src="cashfree-payments.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var target = params.get("continue");
  var orderId = params.get("order_id") || "";
  var sku = params.get("sku") || "";
  var statusBox = document.getElementById("statusBox");
  var continueLink = document.getElementById("continueLink");
  if(target && /^[\w\-./#?=&%]+$/.test(target)){
    continueLink.href = decodeURIComponent(target);
  }

  function grantAccess(details){
    if(!sku)return;
    try{
      var store = JSON.parse(localStorage.getItem("lumeCashfreeAccess") || "{}") || {};
      store[sku] = Object.assign({status:"PAID",order_id:orderId,grantedAt:new Date().toISOString()},details||{});
      localStorage.setItem("lumeCashfreeAccess",JSON.stringify(store));
    }catch(err){}
  }

  function showStatus(kind,message){
    statusBox.className = "status " + (kind || "");
    statusBox.textContent = message;
  }

  if(!orderId || !/^[A-Za-z0-9_-]{3,45}$/.test(orderId)){
    showStatus("fail","We could not read a valid Cashfree order reference. Please message Lume Live if payment was debited.");
    return;
  }

  if(location.protocol === "file:"){
    showStatus("wait","Local preview detected. On the live website, this page will verify the Cashfree order automatically.");
    return;
  }

  var cfg = typeof window.lumeCashfreeGetConfig === "function" ? window.lumeCashfreeGetConfig() : {};
  var statusEndpoint = cfg.orderStatusEndpoint || "/api/cashfree/order-status";
  fetch(statusEndpoint+"?order_id="+encodeURIComponent(orderId))
    .then(function(res){
      if(!res.ok)throw new Error("Status check failed");
      return res.json();
    })
    .then(function(data){
      var status = String(data.order_status || "").toUpperCase();
      if(status === "PAID"){
        grantAccess({cf_order_id:data.cf_order_id||"",amount:data.order_amount||"",customer:data.customer||{}});
        showStatus("","Payment verified. Your access is ready on this device.");
      }else{
        showStatus("wait","Cashfree status is "+(status || "pending")+". If money was debited, wait a minute and refresh this page.");
      }
    })
    .catch(function(){
      showStatus("fail","We could not verify automatically yet. Please continue or confirm on WhatsApp with your payment reference.");
    });
})();
</script>
</body>
</html>
