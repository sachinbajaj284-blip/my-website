<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' *.cashfree.com www.gstatic.com www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src fonts.gstatic.com data:; img-src 'self' data: www.google-analytics.com www.googletagmanager.com *.cashfree.com; connect-src 'self' *.cashfree.com *.googleapis.com *.firebaseio.com *.firebaseapp.com www.gstatic.com www.googletagmanager.com *.google-analytics.com *.analytics.google.com; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Payment Received | Lume Live</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 18% 12%,rgba(232,185,90,.24),transparent 28%),radial-gradient(circle at 86% 20%,rgba(255,255,255,.18),transparent 30%),linear-gradient(135deg,#0D1B40,#0A6E6E);font-family:Arial,sans-serif;color:#102033;padding:18px}
.card{width:min(520px,100%);background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(247,252,251,.72));border:1px solid rgba(255,255,255,.78);border-radius:28px;padding:30px;box-shadow:0 28px 90px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.82);text-align:center;-webkit-backdrop-filter:blur(24px) saturate(1.16);backdrop-filter:blur(24px) saturate(1.16);}
img{width:74px;height:74px;object-fit:contain;margin-bottom:10px}
h1{font-family:Georgia,serif;color:#0D1B40;margin:0 0 10px;font-size:2rem}
p{color:#55706D;line-height:1.6;margin:0 0 18px}
.status{margin:0 0 18px;padding:12px 14px;border-radius:14px;background:#EEF7F5;color:#0A6E6E;font-weight:800;font-size:.92rem}
.status.wait{background:#FFF7E8;color:#9A6414}
.status.fail{background:#FFF1F1;color:#A63737}
.actions{display:grid;gap:10px}
a{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:999px;text-decoration:none;font-weight:900}
.primary{background:linear-gradient(135deg,#C9933A,#E8B95A);color:#0D1B40}
.ghost{background:#EEF7F5;color:#0A6E6E;border:1px solid #D6EAE7}
</style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="Lume Live">
    <h1 id="returnTitle">Payment Step Complete</h1>
    <p id="returnCopy">Thank you. We are checking the payment status now. Once Cashfree confirms it, you can continue without sending a screenshot.</p>
    <div class="status wait" id="statusBox">Checking Cashfree payment status...</div>
    <div class="actions">
      <a class="primary" id="continueLink" href="assessment.html#self-assessments">Start Assessment Now</a>
      <a class="ghost" href="https://wa.me/917015671280?text=Hi%20Lume%20Live!%20I%20have%20completed%20my%20Cashfree%20payment.%20Please%20confirm%20my%20access." target="_blank" rel="noopener">Confirm On WhatsApp</a>
      <a class="ghost" href="index.html">Back To Home</a>
    </div>
  </main>
<script src="cashfree-payments.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var target = params.get("continue");
  var orderId = params.get("order_id") || "";
  var sku = params.get("sku") || "";
  var statusBox = document.getElementById("statusBox");
  var continueLink = document.getElementById("continueLink");
  var returnTitle = document.getElementById("returnTitle");
  var returnCopy = document.getElementById("returnCopy");
  var skuTargets = {
    "student-full-report": { href:"assessment.html#self-assessments", label:"Start Assessment Now", title:"Payment Verified" },
    "lume-lens-working-profile": { href:"for-working-professionals.html#self-assessments", label:"Start Lume Lens Now", title:"Payment Verified" },
    "career-intelligence-roadmap": { href:"career-intelligence.html?access=assessment#career-intelligence", label:"Open Career Intelligence", title:"Payment Verified" },
    "parents-handbook": { href:"for-parents.html#parents-handbook", label:"Return To Parent Guide", title:"Payment Received" },
    "intro-session": { href:"index.html#contact", label:"Return To Booking", title:"Payment Received" }
  };
  if(skuTargets[sku]){
    continueLink.href = skuTargets[sku].href;
    continueLink.textContent = skuTargets[sku].label;
  }
  if(target){
    var decoded = "";
    try{ decoded = decodeURIComponent(target); }catch(e){ decoded = ""; }
    // Only allow same-origin relative paths: must start with / then a non-slash/non-backslash char
    // This prevents protocol-relative URLs (//evil.com) and javascript: URIs
    if(decoded && /^\/[^/\\]/.test(decoded)){
      continueLink.href = decoded;
    }
  }

  function grantAccess(details){
    if(!sku)return;
    try{
      var store = JSON.parse(localStorage.getItem("lumeCashfreeAccess") || "{}") || {};
      store[sku] = Object.assign({status:"PAID",order_id:orderId,grantedAt:new Date().toISOString()},details||{});
      localStorage.setItem("lumeCashfreeAccess",JSON.stringify(store));
    }catch(err){}
  }

  function showStatus(kind,message){
    statusBox.className = "status " + (kind || "");
    statusBox.textContent = message;
  }

  function autoContinue(){
    var href = continueLink.getAttribute("href") || "";
    if(!href)return;
    returnCopy.textContent = "Cashfree has confirmed your payment. Opening your assessment now...";
    showStatus("","Payment verified. Redirecting you to the start area now.");
    setTimeout(function(){ window.location.href = href; }, 900);
  }

  if(!orderId || !/^[A-Za-z0-9_-]{3,45}$/.test(orderId)){
    showStatus("fail","We could not read a valid Cashfree order reference. Please message Lume Live if payment was debited.");
    return;
  }

  if(location.protocol === "file:"){
    showStatus("wait","Local preview detected. On the live website, this page will verify the Cashfree order automatically.");
    return;
  }

  var cfg = typeof window.lumeCashfreeGetConfig === "function" ? window.lumeCashfreeGetConfig() : {};
  var statusEndpoint = cfg.orderStatusEndpoint || "/api/cashfree/order-status";
  fetch(statusEndpoint+"?order_id="+encodeURIComponent(orderId))
    .then(function(res){
      if(!res.ok)throw new Error("Status check failed");
      return res.json();
    })
    .then(function(data){
      var status = String(data.order_status || "").toUpperCase();
      if(status === "PAID"){
        grantAccess({cf_order_id:data.cf_order_id||"",amount:data.order_amount||"",customer:data.customer||{}});
        if(skuTargets[sku]){
          returnTitle.textContent = skuTargets[sku].title;
          continueLink.textContent = skuTargets[sku].label;
        }
        autoContinue();
      }else{
        showStatus("wait","Cashfree status is "+(status || "pending")+". If money was debited, wait a minute and refresh this page.");
      }
    })
    .catch(function(){
      showStatus("fail","We could not verify automatically yet. Please continue or confirm on WhatsApp with your payment reference.");
    });
})();
</script>
</body>
</html>
