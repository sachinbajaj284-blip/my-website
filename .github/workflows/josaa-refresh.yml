name: Refresh JoSAA dataset

# The JoSAA ingest needs to reach josaa.admissions.nic.in, which many networks — and the
# Claude Code sandbox — block. GitHub's runners have unrestricted outbound access, so this
# workflow is the reliable place to run it.
#
# Run it from the Actions tab: "Refresh JoSAA dataset" -> "Run workflow".
# Start with smoke_test = true to confirm JoSAA is reachable and the parser still matches,
# before pulling tens of thousands of rows.
#
# The ingest tools use only Node built-ins, so there is nothing to install.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to pull, comma separated'
        required: true
        default: '2024,2025,2026'
      smoke_test:
        description: 'Pull only a few hundred rows to check the scraper works. Never commits.'
        type: boolean
        default: true
      dump:
        description: 'Save the raw request/response of a few exchanges as an artifact. Use when a pull returns no rows. Never commits.'
        type: boolean
        default: false
      inst_type:
        description: 'Only these institute types, comma separated (IIT,NIT,IIIT,Other-GFTI). Blank = all four.'
        default: ''
      max_institutes:
        description: 'Stop after N institutes per type. Blank = all of them. 2 for a quick check.'
        default: ''
      pacing_probe:
        description: 'Only measure how many plain GETs JoSAA answers before it stops. Makes no POSTs, pulls nothing.'
        type: boolean
        default: false
      commit:
        description: 'Commit the dataset and generated pages back to this branch'
        type: boolean
        default: true
  schedule:
    # JoSAA publishes final ranks around late July / August. Check monthly through the
    # counselling season; the validator warns if the newest year is stale.
    - cron: '0 3 5 7,8,9 *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A per-institute walk is many more requests than the old one-query-per-type
    # pull, each with a 2-4s courtesy gap: roughly 24 minutes for one year across
    # all four types, or 42 if JoSAA drops the form after every submit and the
    # cascade has to be re-walked. 45 minutes could not finish a single year.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail loudly and early if the runner cannot reach JoSAA at all. Indian government
      # sites occasionally block or throttle non-Indian IPs; if that is what is happening,
      # this step says so instead of leaving a confusing parser error later.
      - name: Check JoSAA is reachable
        # Skipped for a pacing probe: that run is measuring how many requests a fresh
        # address gets, and this step would spend the first one before counting starts.
        if: ${{ !inputs.pacing_probe }}
        run: |
          set -e
          URL="https://josaa.admissions.nic.in/applicant/seatmatrix/openingclosingrankarchieve.aspx"
          # JoSAA is intermittently unreachable from GitHub's IP ranges: on 26 August one
          # run fetched it fine and the next timed out completely, four minutes apart.
          # One timeout is not an outage, so try a few times before believing it.
          # Measured behaviour on 26 August: run #7 fetched the page at 13:52, run #8
          # timed out three times between 13:55 and 13:58, run #7's window had closed
          # again by then. JoSAA flaps on a roughly three-minute cycle from GitHub's
          # ranges, so the useful strategy is a short per-attempt timeout over a long
          # wall-clock window rather than a few patient attempts. Eight tries spread over
          # about ten minutes catches a window; three over four minutes does not.
          # Two attempts, not eight. The eight-attempt loop was written for the theory
          # that JoSAA flaps on a three-minute cycle; run #14 replaced that theory. What
          # actually happens is that the address is answered for the first few requests
          # and then dropped, so a probe that hammers the host eight times is not
          # measuring reachability — it is spending the very budget the ingest needs,
          # and then handing the ingest a blocked IP.
          CODE=000
          ATTEMPTS=2
          for attempt in $(seq 1 $ATTEMPTS); do
            CODE=$(curl -sS -o /tmp/josaa-probe.html -w '%{http_code}' -m 30 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36' \
              "$URL" || echo "000")
            echo "attempt $attempt/$ATTEMPTS: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep 60
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::Could not reach the JoSAA archive after $ATTEMPTS attempts over ~10 minutes (last HTTP $CODE)."
            echo "This is usually JoSAA refusing or throttling non-Indian traffic rather than"
            echo "anything wrong with the ingest. Options, in order of least effort:"
            echo "  1. Re-run this workflow later — it has come back on its own before."
            echo "  2. Run it from a machine in India:  npm run josaa:probe && npm run josaa:refresh"
            echo "  3. Run it from a self-hosted runner with an Indian egress IP."
            exit 1
          fi
          echo "Fetched $(wc -c < /tmp/josaa-probe.html) bytes"

          # curl and Node do not trust the same things. curl succeeding tells us the host
          # is up; it does not tell us the ingest can reach it, and a run has already
          # failed in exactly that gap. Ask Node directly, and show the chain if it says no.
          echo "--- Node fetch ---"
          node -e "
            const url = process.argv[1];
            fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } })
              .then(r => console.log('node fetch OK — HTTP ' + r.status))
              .catch(e => {
                console.log('node fetch FAILED');
                let c = e, d = 0;
                while (c && d++ < 5) { console.log('   ' + [c.code, c.errno, c.syscall, c.message].filter(Boolean).join(' ')); c = c.cause; }
                process.exitCode = 3;
              });
          " "$URL" || NODE_FETCH_FAILED=1

          if [ "${NODE_FETCH_FAILED:-0}" = "1" ]; then
            echo "--- TLS chain (curl works, Node does not — usually a missing intermediate) ---"
            echo | openssl s_client -connect josaa.admissions.nic.in:443 \
              -servername josaa.admissions.nic.in 2>&1 \
              | sed -n '/Certificate chain/,/Server certificate/p' | head -30 || true
            echo | openssl s_client -connect josaa.admissions.nic.in:443 \
              -servername josaa.admissions.nic.in 2>&1 \
              | grep -iE 'verify (error|return code)' || true
            echo "::warning::curl reached JoSAA but Node could not. The ingest uses Node."
          fi

      # Parser unit tests need no network and catch a broken helper before we hit the
      # government server thousands of times.
      - name: Parser unit tests
        run: node tools/josaa-parser.test.mjs

      # JoSAA renames its ASP.NET controls between admission years. The probe reports
      # whether field discovery still matches the live page.
      # Costs a request, so it is not run ahead of a real pull: the ingest fetches the
      # same form itself and discovers the same fields from it.
      - name: Probe the JoSAA form
        if: ${{ inputs.dump && !inputs.pacing_probe }}
        run: node tools/josaa-ingest.mjs --probe

      # A correctly shaped postback still comes back as the 11,950-byte "Not Available"
      # page, so something in the request contract is missing rather than malformed. The
      # two candidates are an anti-automation token (the form ships an empty
      # ctl00$hdnSecKey and loads Common.js) and an UpdatePanel expecting an async post.
      # This step says which, and costs one extra request.
      # Answered in run #10 — UpdatePanel present, nothing writes hdnSecKey — so this is
      # now a diagnostic kept for the next time the contract changes, not a per-run cost.
      # It fetches Common.js, and requests are the scarce resource here.
      - name: Inspect the postback contract
        if: ${{ inputs.dump && !inputs.pacing_probe }}
        run: |
          echo "--- hidden fields on the served page ---"
          grep -oE '<input[^>]*type="hidden"[^>]*>' /tmp/josaa-probe.html \
            | grep -oE 'name="[^"]+"( value="[^"]{0,40})?' | head -20 || true

          echo
          echo "--- ASP.NET AJAX in play? ---"
          for token in ScriptManager UpdatePanel __ASYNCPOST PageRequestManager Sys.WebForms; do
            printf '%-22s %s\n' "$token" "$(grep -c "$token" /tmp/josaa-probe.html || echo 0)"
          done

          echo
          echo "--- anything that writes hdnSecKey ---"
          grep -oiE '.{80}hdnseckey.{80}' /tmp/josaa-probe.html | head -5 || echo "(not in the page)"

          echo
          echo "--- Common.js: does it set a security key? ---"
          curl -sS -m 30 -A 'Mozilla/5.0' \
            https://josaa.admissions.nic.in/applicant/Scripts/Common.js -o /tmp/common.js || true
          if [ -s /tmp/common.js ]; then
            echo "fetched $(wc -c < /tmp/common.js) bytes"
            grep -oiE '.{100}seckey.{140}' /tmp/common.js | head -5 || echo "(no seckey reference)"
          else
            echo "(could not fetch Common.js)"
          fi

      # Does the address get blocked, or is the postback being rejected? Identical GETs,
      # no POSTs: if a plain GET that worked stops working, nothing about the request
      # shape is responsible and pacing is the only lever left.
      - name: Measure the request budget
        if: ${{ inputs.pacing_probe }}
        run: node tools/josaa-ingest.mjs --pacing-probe

      # A dump run is a diagnostic, not a pull: it saves what JoSAA actually returned and
      # is expected to produce no dataset, so it must not fail the job on empty output.
      - name: Dump raw exchanges
        if: ${{ inputs.dump == true }}
        run: node tools/josaa-ingest.mjs --years "${{ inputs.years || '2024,2025,2026' }}" --dump --verbose || true

      # The .html files are only useful downloaded, but the summaries and request lines
      # are what actually answer the question — so print them into the log, where they
      # can be read without pulling the artifact down.
      - name: Print dump summaries
        if: ${{ inputs.dump == true }}
        run: |
          for f in work/dump/*.request.txt work/dump/*.summary.txt; do
            [ -f "$f" ] || continue
            echo "══════════════════════════════════════════════════════════"
            echo "── $f"
            echo "══════════════════════════════════════════════════════════"
            cat "$f"
            echo
          done

      - name: Upload raw exchange dump
        if: ${{ inputs.dump == true }}
        uses: actions/upload-artifact@v4
        with:
          name: josaa-raw-dump
          path: work/dump/
          # A dump run that never reached JoSAA writes nothing, and that is a
          # network result rather than a broken job. Run #11 failed here purely
          # because the directory was empty, which buried the actual finding.
          if-no-files-found: warn
          retention-days: 14

      # Let the address go quiet before the pull.
      #
      # Everything above this line — the reachability check, and the probe and contract
      # inspection when they run — costs requests against whatever budget JoSAA allows,
      # and in run #14 the budget looked like three or four before the host stopped
      # answering for four minutes. Starting the ingest immediately after the pre-flight
      # is starting it on an address that has just spent its allowance, which is a fair
      # description of every failed run so far.
      - name: Let the rate limit recover
        if: ${{ !inputs.pacing_probe }}
        run: |
          echo "Idling 120s so the pre-flight requests age out before the pull starts."
          sleep 120

      - name: Ingest cutoffs
        if: ${{ inputs.dump != true && !inputs.pacing_probe }}
        env:
          YEARS: ${{ inputs.years || '2024,2025,2026' }}
          INST_TYPE: ${{ inputs.inst_type }}
          MAX_INSTITUTES: ${{ inputs.max_institutes }}
          SMOKE: ${{ inputs.smoke_test }}
        run: |
          ARGS="--years $YEARS"
          [ -n "$INST_TYPE" ]      && ARGS="$ARGS --inst-type $INST_TYPE"
          [ -n "$MAX_INSTITUTES" ] && ARGS="$ARGS --max-institutes $MAX_INSTITUTES"

          # A smoke test answers "does one query come back with rows", not
          # "can we walk a hundred institutes". Two institutes is enough: the
          # first proves the cascade, the second proves the session survived
          # a submit — which is the difference between four requests each and
          # seven.
          if [ "$SMOKE" = "true" ]; then
            case "$ARGS" in
              *--max-institutes*) ;;
              *) ARGS="$ARGS --max-institutes 2" ;;
            esac
            ARGS="$ARGS --limit 300 --verbose"
          fi

          echo "josaa-ingest $ARGS"
          node tools/josaa-ingest.mjs $ARGS

      - name: Validate dataset
        if: ${{ inputs.dump != true && !inputs.pacing_probe }}
        run: node tools/josaa-validate.mjs

      - name: Generate browse pages
        if: ${{ inputs.dump != true && !inputs.pacing_probe }}
        run: node tools/josaa-pages.mjs

      # Always publish the result as an artifact, so a smoke test — or a run you choose not
      # to commit — can still be inspected and downloaded.
      - name: Upload dataset artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: josaa-dataset
          path: |
            data/josaa/
            colleges/
            sitemap-colleges.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Summarise
        if: always()
        run: |
          {
            echo "### JoSAA refresh"
            if [ -f data/josaa/manifest.json ]; then
              node -e "
                const m = require('./data/josaa/manifest.json');
                console.log('- Years: ' + m.years.join(', '));
                console.log('- Rows: ' + (m.counts?.records ?? 'n/a'));
                console.log('- Institutes: ' + m.institutes.length + ', branches: ' + m.branches.length);
                if (m.problems?.length) {
                  console.log('- Problems:');
                  m.problems.forEach(p => console.log('  - ' + p));
                }
              "
              echo "- Generated pages: $(ls colleges 2>/dev/null | wc -l)"
            else
              echo "- No manifest produced."
            fi
            if [ "${{ inputs.smoke_test }}" = "true" ]; then
              echo ""
              echo "**Smoke test only — nothing was committed.** Re-run with smoke_test unchecked for the full pull."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A smoke test pulls a deliberately partial dataset. Committing it would publish a
      # dataset with most colleges missing, which is worse than having none.
      - name: Commit dataset
        if: ${{ inputs.smoke_test != true && inputs.commit != false && inputs.dump != true }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/josaa colleges sitemap-colleges.xml
          if git diff --staged --quiet; then
            echo "Dataset unchanged — nothing to commit."
            exit 0
          fi
          ROWS=$(node -e "console.log(require('./data/josaa/manifest.json').counts?.records ?? 0)")
          YEARS=$(node -e "console.log(require('./data/josaa/manifest.json').years.join(', '))")
          git commit -m "Refresh JoSAA dataset ($YEARS, $ROWS rows)" \
                     -m "Generated by the josaa-refresh workflow from the official JoSAA archive."
          git push origin HEAD:"${GITHUB_REF_NAME}"
