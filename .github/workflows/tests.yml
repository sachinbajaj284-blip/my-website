# Runs the money-path tests on every change.
#
# The checkout suite is here because a stale line in cashfree-payments.js
# once took every payment on the site down for a day, and nothing in the
# repo noticed — there was no CI that ran on a push at all, only the
# scheduled JoSAA refresh. This is that missing gate.
#
# Everything runs on plain Node with no browser and no install step, so a
# broken checkout is caught in seconds rather than by a customer.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap.mjs reads each page's last commit date. A shallow clone
          # reports the single fetched commit for every file, so every URL
          # would come back dated today and the check below would fail on
          # every push. Full history is what makes the dates real.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No npm install. These suites deliberately depend on nothing outside
      # the repo — the ones that touch Firestore run against
      # tools/firestore-stub.mjs, which intercepts require("firebase-admin")
      # before it resolves — so there is no lockfile step to break and
      # nothing to download before the payment path can be checked. Adding
      # a step here that needs node_modules would undo that; check a new
      # suite runs on a bare checkout before listing it.
      - name: Checkout flow
        run: npm run checkout:test

      - name: Account gate
        run: npm run account:test

      - name: Coupon rules
        run: npm run coupons:test

      # The partner ledger pays real money out by hand every month, and
      # decides who may pay the joining fee. Same stub, no install.
      - name: Partner programme
        run: npm run partners:test

      - name: Owner dispatch
        run: npm run dispatch:test

      - name: Manual entitlements
        run: npm run entitlements:test

      # The webhook is the only fulfilment path that runs when the
      # customer's browser never comes back, and its signature check is
      # the whole trust boundary on a public URL that grants paid product.
      - name: Cashfree webhook
        run: npm run webhook:test

      - name: JoSAA parser
        run: npm run josaa:test

      # sitemap.xml is generated, not hand-written, but nothing forced it to
      # be regenerated — so it drifted: every entry read August while pages
      # had changed in September, which tells Google there is nothing new to
      # recrawl. This fails the build when it drifts again.
      #   Fix with: npm run sitemap
      - name: Sitemap is current
        run: npm run sitemap:check
